[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "environmental-monitoring-agents"
version = "0.1.0"
description = "Multi-agent environmental monitoring for a fictional operator: seismic, satellite and weather agents whose correlated signals feed a prediction coordinator behind a human gate."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
